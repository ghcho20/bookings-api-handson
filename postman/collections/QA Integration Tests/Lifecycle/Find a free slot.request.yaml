$kind: http-request
description: Finds a free slot on res_3f9a1c in a fixed December 2026 window and stores its first hour.
url: "{{baseUrl}}/resources/res_3f9a1c/availability?from=2026-12-07T09:00:00Z&to=2026-12-07T18:00:00Z"
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: from
    value: "2026-12-07T09:00:00Z"
  - key: to
    value: "2026-12-07T18:00:00Z"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      var body = pm.response.json();

      pm.test('Availability is for res_3f9a1c with at least one free slot', function () {
          pm.expect(body.resource_id).to.equal('res_3f9a1c');
          pm.expect(body.slots).to.be.an('array').that.is.not.empty;
      });

      pm.test('First slot is at least one hour long; store its first hour', function () {
          var slot = body.slots[0];
          var start = new Date(slot.start_time);
          var end = new Date(start.getTime() + 60 * 60 * 1000);
          pm.expect(end.getTime()).to.be.at.most(new Date(slot.end_time).getTime());
          var iso = function (d) { return d.toISOString().replace(/\.\d{3}Z$/, 'Z'); };
          pm.collectionVariables.set('slot_start', iso(start));
          pm.collectionVariables.set('slot_end', iso(end));
      });
    language: text/javascript
order: 1000
