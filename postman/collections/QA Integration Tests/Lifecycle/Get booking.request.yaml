$kind: http-request
description: Reads the new booking back.
url: "{{baseUrl}}/bookings/{{booking_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Same booking, still pending', function () {
          var body = pm.response.json();
          pm.expect(body.id).to.equal(pm.collectionVariables.get('booking_id'));
          pm.expect(body.status).to.equal('pending');
      });
    language: text/javascript
order: 3000
