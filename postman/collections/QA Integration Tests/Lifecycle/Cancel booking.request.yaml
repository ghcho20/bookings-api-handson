$kind: http-request
description: Cancels the confirmed booking with a reason.
url: "{{baseUrl}}/bookings/{{booking_id}}/cancel"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "QA lifecycle test cleanup"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Booking is cancelled and the reason is echoed', function () {
          var body = pm.response.json();
          pm.expect(body.id).to.equal(pm.collectionVariables.get('booking_id'));
          pm.expect(body.status).to.equal('cancelled');
          pm.expect(body.cancel_reason).to.equal('QA lifecycle test cleanup');
      });
    language: text/javascript
order: 5000
