$kind: http-request
description: Cancelling an already cancelled booking is an illegal transition (409).
url: "{{baseUrl}}/bookings/{{booking_id}}/cancel"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json, application/problem+json
body:
  type: json
  content: |-
    {
      "reason": "QA lifecycle test cleanup"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
      });

      pm.test('Content-Type is application/problem+json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      });

      pm.test('Problem type is invalid-transition', function () {
          var body = pm.response.json();
          pm.expect(body.status).to.equal(409);
          pm.expect(body.type).to.match(/invalid-transition$/);
      });
    language: text/javascript
order: 6000
