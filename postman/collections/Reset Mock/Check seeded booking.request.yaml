$kind: http-request
description: Confirms the reset took effect; the booking the Smoke and Contract runs act on is pending again.
url: "{{baseUrl}}/bookings/bkg_9d2e47"
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Seeded booking is readable', function () {
          pm.response.to.have.status(200);
      });

      pm.test('bkg_9d2e47 is back to pending', function () {
          pm.expect(pm.response.json().status).to.equal('pending');
      });
    language: text/javascript
order: 2000
