# SAMPLE: CI pushes the repo to the Postman cloud workspace (automatic, on merge to main).
# Copy to .github/workflows/postman-publish.yml. Proven on GitHub in the first build.
#
# Needs: secret POSTMAN_SERVICE_ACCOUNT_API_KEY, the same service-account key the bootstrap workflow uses
# (verified: `postman login --with-api-key` accepts it, and the push works). The service account must be a
# member of the workspace with edit access. A personal key also works but ties CI to one person.
# Replace bookings-api.yaml with your spec's path.
name: Publish to Postman workspace

# CI is the only writer to the shared cloud workspace. It runs only after a merge to
# main, never from a branch or PR, so unreviewed work never appears in the workspace.
# Path filter: a commit that changes only this workflow file does NOT trigger it;
# use "Run workflow" (workflow_dispatch) to test a change to the workflow itself.
on:
  push:
    branches: [main]
    paths:
      - bookings-api.yaml
      - postman/**
      - .postman/**
  workflow_dispatch:

concurrency:                 # shared with the bootstrap workflow: one cloud writer at a time
  group: postman-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Postman CLI        # pin the version you tested with
        run: npm install -g postman-cli@1.73.0

      - name: Log in to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_SERVICE_ACCOUNT_API_KEY }}   # env var name is what the CLI step reads
        run: |
          if [ -z "$POSTMAN_API_KEY" ]; then echo "::error::POSTMAN_API_KEY is not set."; exit 1; fi
          postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Preview changes            # read-only; default strategy creates/updates, never deletes
        run: postman workspace diff --push-strategy default

      - name: Push to workspace
        run: postman workspace push --yes

      # A push assigns cloud IDs to NEW entities and rewrites .postman/resources.yaml.
      # If a new ID is not committed, the next run creates a duplicate. The push also
      # strips comments/blank lines and reorders entries, so compare sorted content only.
      # Expected on the first run after adding a collection: this fails once. Copy the new
      # ID from the log into .postman/resources.yaml, commit, push.
      - name: Check that cloud IDs are recorded
        run: |
          norm() { grep -v -E '^[[:space:]]*(#|$)' | sort || true; }
          if ! diff <(git show HEAD:.postman/resources.yaml | norm) <(norm < .postman/resources.yaml); then
            echo "::error::The push created new cloud objects. Commit the new IDs in .postman/resources.yaml and rerun."
            exit 1
          fi
